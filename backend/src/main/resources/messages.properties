# Thông điệp tiếng Việt cho các lỗi chuẩn của Spring MVC, trả trong trường "detail" của Problem Details.
# Khoá: problemDetail.<tên đầy đủ của exception>. {0}, {1}… là tham số Spring truyền vào.
# Không dùng dấu nháy đơn ('): định dạng MessageFormat coi nó là ký tự đặc biệt.
# Lỗi nghiệp vụ (ví dụ ResourceNotFoundException) tự mang thông điệp, không cần khai báo ở đây.

problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Dữ liệu gửi lên không hợp lệ.
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=Dữ liệu gửi lên không hợp lệ.
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=Không đọc được dữ liệu gửi lên. Hãy kiểm tra định dạng JSON.
problemDetail.org.springframework.beans.TypeMismatchException=Giá trị của {0} không đúng kiểu dữ liệu.
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Thiếu tham số {0}.
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Không tìm thấy đường dẫn này.
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Đường dẫn này không hỗ trợ phương thức {0}.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Không hỗ trợ kiểu dữ liệu {0}.
